<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Assistant</title>
    <meta name="description" content="Interactive guide to understand the election process, timelines, and voting methods.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <main class="container">
        <header>
            <div class="badge">Your Vote Matters</div>
            <h1>Election <span class="highlight">Assistant</span></h1>
            <p id="general-info-text">Loading information...</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="timelines">Timelines & Deadlines</button>
            <button class="tab-btn" data-tab="registration">How to Register</button>
            <button class="tab-btn" data-tab="voting">Voting Methods</button>
            <button class="tab-btn" data-tab="register-form">Register Now</button>
        </nav>

        <div class="content-area">
            <!-- Timelines Tab -->
            <section id="timelines" class="tab-pane active">
                <div class="timeline-container" id="timelines-list">
                    <!-- Populated by JS -->
                </div>
            </section>

            <!-- Registration Tab -->
            <section id="registration" class="tab-pane">
                <div class="registration-card">
                    <h2>Step-by-Step Registration</h2>
                    <ul class="step-list" id="registration-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </section>

            <!-- Voting Methods Tab -->
            <section id="voting" class="tab-pane">
                <div class="methods-grid" id="methods-list">
                    <!-- Populated by JS -->
                </div>
            </section>

            <!-- Register Form Tab -->
            <section id="register-form" class="tab-pane">
                <div class="registration-card form-card">
                    <h2>Voter Registration Form</h2>
                    <form id="voter-form" class="voter-form">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" name="dob" required>
                        </div>
                        <div class="form-group">
                            <label for="level">Level / Grade</label>
                            <input type="text" id="level" name="level" required placeholder="e.g. Freshman, Grade 12">
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="address">Home Address</label>
                            <textarea id="address" name="address" required placeholder="123 Main St..."></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Submit Registration</button>
                        <div id="form-message" class="form-message hidden"></div>
                    </form>
                </div>
            </section>
        </div>
        
        <footer>
            <p>&copy; 2026 Election Assistant Interactive Guide. Exercise your right to vote.</p>
        </footer>
    </main>

    <!-- Chatbot Widget -->
    <div id="chat-widget" class="chat-widget">
        <div id="chat-window" class="chat-window hidden">
            <div class="chat-header">
                <h3>Election Assistant AI</h3>
                <button id="close-chat-btn" class="close-btn">&times;</button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="message bot-message">
                    Hello! I'm the Election Assistant AI. How can I help you today?
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type your question..." autocomplete="off">
                <button id="send-chat-btn" class="send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
        <button id="chat-toggle-btn" class="chat-toggle-btn">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
